{% extends "base.html" %}
{% block content %}

<div class="text-center mb-4">
    <h2 class="fw-bold">Automatic Timetable System</h2>
    <p class="text-muted">Manage data and generate timetable easily</p>
</div>

<div class="row g-4">

    <div class="col-md-3">
        <div class="card shadow text-center p-3">
            <h5>Add Subject</h5>
            <a href="/add_data" class="btn btn-primary btn-sm mt-2">Open</a>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow text-center p-3">
            <h5>Add Room</h5>
            <a href="/add_room" class="btn btn-success btn-sm mt-2">Open</a>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow text-center p-3">
            <h5>Manage Data</h5>
            <a href="/view_data" class="btn btn-warning btn-sm mt-2">Open</a>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow text-center p-3">
            <h5>Timetable</h5>
            <a href="/timetable" class="btn btn-danger btn-sm mt-2">Open</a>
        </div>
    </div>

</div>

{% endblock %}
