{% extends "base.html" %}
{% block content %}

<div class="card shadow p-4">
    <h4>Add Class</h4>

    <form method="POST">
        <div class="mb-3">
            <label>Class Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. SE-A, TE-B" required>
        </div>

        <button class="btn btn-primary">Add Class</button>
    </form>
</div>

<br>

<div class="card shadow p-3">
    <h5>Class List</h5>

    <table class="table table-bordered">
        <tr>
            <th>ID</th><th>Name</th>
        </tr>

        {% for c in classes %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
