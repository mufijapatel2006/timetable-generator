{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle mb-3" style="width: 65px; height: 65px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-shield-lock" viewBox="0 0 16 16">
                        <path d="M5.338 1.59a61 61 0 0 0-2.837.856.48.48 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.7 10.7 0 0 0 2.287 2.233c.346.244.652.42.893.533q.18.085.293.118a1 1 0 0 0 .101.025 1 1 0 0 0 .1-.025q.114-.034.294-.118c.24-.113.547-.29.893-.533a10.7 10.7 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.596 4.477-.787 7.795-2.465 9.99a11.8 11.8 0 0 1-2.517 2.453 7 7 0 0 1-1.048.625c-.28.132-.581.24-.829.24s-.548-.108-.829-.24a7 7 0 0 1-1.048-.625 11.8 11.8 0 0 1-2.517-2.453C1.928 10.487.545 7.169 1.141 2.692A1.54 1.54 0 0 1 2.185 1.43 63 63 0 0 1 5.072.56"/>
                        <path d="M9.5 6.5a1.5 1.5 0 0 1-1 1.415l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 1 1 9.5 6.5"/>
                    </svg>
                </div>
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-1 rounded-pill text-uppercase fw-semibold mb-2">
                    Administrator Access
                </span>
                <h3 class="fw-bold mb-1">Admin Portal Sign In</h3>
                <p class="text-muted small">Manage curriculum, faculty, master schedules &amp; settings</p>
            </div>

            <form method="POST" action="/admin/login">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Admin Username</label>
                    <input type="text" id="usernameInput" name="username" class="form-control form-control-lg rounded-3" placeholder="Enter admin username" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="passwordInput" name="password" class="form-control form-control-lg rounded-3" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-danger btn-lg w-100 rounded-3 shadow-sm mb-3">
                    Sign In to Admin Portal
                </button>
            </form>

            <div class="alert alert-danger-subtle border-0 rounded-3 small mt-2">
                <div class="fw-bold mb-1">🛡️ Admin Credentials:</div>
                <div class="text-muted">Username: <code>admin</code> &bull; Password: <code>admin123</code></div>
            </div>

            <hr class="my-3 text-muted">

            <div class="text-center small text-muted">
                Need a different portal?
                <div class="mt-2 d-flex justify-content-center gap-3">
                    <a href="/teacher/login" class="text-decoration-none text-success fw-semibold">👨‍🏫 Teacher Login</a>
                    <span>&bull;</span>
                    <a href="/student/login" class="text-decoration-none text-primary fw-semibold">🎓 Student Login</a>
                    <span>&bull;</span>
                    <a href="/login" class="text-decoration-none text-secondary">All Portals</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
