<!DOCTYPE html>
<html>
<head>
    <title>Timetable System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary p-3">
    <a class="navbar-brand" href="/">Timetable</a>
    <div>
        <a href="/add_data" class="btn btn-light btn-sm">Add Subject</a>
        <a href="/add_room" class="btn btn-light btn-sm">Add Room</a>
        <a href="/add_faculty" class="btn btn-light btn-sm">Add Faculty</a>
        <a href="/add_class" class="btn btn-light btn-sm">Add Class</a>
        <a href="/assign_batch" class="btn btn-light btn-sm">Assign Batch</a>
        <a href="/view_data" class="btn btn-light btn-sm">View Data</a>
        <a href="/timetable" class="btn btn-light btn-sm">Timetable</a>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- TOAST -->
<div class="position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast text-white bg-success">
        <div class="toast-body" id="toastMsg"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showToast(msg){
    document.getElementById("toastMsg").innerText = msg;
    new bootstrap.Toast(document.getElementById("toast")).show();
}

function confirmDelete(url){
    if(confirm("Are you sure you want to delete this record?")){
        window.location.href = url;
    }
}
</script>

{% with messages = get_flashed_messages() %}
{% if messages %}
<script>
    showToast("{{ messages[0] }}");
</script>
{% endif %}
{% endwith %}

</body>
</html>
