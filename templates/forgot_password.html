{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning-emphasis rounded-circle mb-3" style="width: 65px; height: 65px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-key-fill" viewBox="0 0 16 16">
                        <path d="M3.5 11.5a3.5 3.5 0 1 1 3.163-5H14L15.5 8 14 9.5l-1-1-1 1-1-1-1 1-1.5-1.5H6.663a3.5 3.5 0 0 1-3.163 2M2.5 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                    </svg>
                </div>
                <span class="badge bg-warning-subtle text-warning-emphasis border border-warning px-3 py-1 rounded-pill text-uppercase fw-semibold mb-2">
                    Security &amp; Recovery
                </span>
                <h3 class="fw-bold mb-1">Reset Password</h3>
                <p class="text-muted small">Verify your identity using your User ID and registered institutional email</p>
            </div>

            <form method="POST" action="/forgot-password" onsubmit="return validateResetForm()">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Faculty / Student / User ID <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control rounded-3" placeholder="Enter your User ID" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Registered Institutional Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control rounded-3" placeholder="Enter your registered email" required>
                    <div class="form-text small">Must match the email address associated with your account profile.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="newPass" name="new_password" class="form-control rounded-start-3" placeholder="Min 6 characters" minlength="6" required>
                        <button class="btn btn-outline-secondary rounded-end-3" type="button" onclick="togglePass('newPass', this)">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="confirmPass" name="confirm_password" class="form-control rounded-start-3" placeholder="Re-enter new password" minlength="6" required>
                        <button class="btn btn-outline-secondary rounded-end-3" type="button" onclick="togglePass('confirmPass', this)">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold shadow-sm mb-3">
                    Update Password
                </button>
            </form>

            <div class="text-center text-muted small mt-2">
                Remember your password?
                <a href="/login" class="text-primary fw-semibold text-decoration-none">Back to Sign In &rarr;</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePass(id, btn) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        btn.innerText = "🙈";
    } else {
        input.type = "password";
        btn.innerText = "👁️";
    }
}

function validateResetForm() {
    const p1 = document.getElementById("newPass").value;
    const p2 = document.getElementById("confirmPass").value;
    if (p1 !== p2) {
        alert("New passwords do not match. Please re-enter.");
        return false;
    }
    return true;
}
</script>

{% endblock %}
